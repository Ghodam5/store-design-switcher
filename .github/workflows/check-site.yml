name: 共通部品と公開HTMLの一致確認
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/build-site.cjs --check
      - run: node --test tools/build-site.test.cjs tools/products.test.cjs tools/purchase-history.test.cjs tools/site-services.test.cjs tools/promos.test.cjs tools/placement-visibility.test.cjs tools/site-notices.test.cjs tools/quantity-picker.test.cjs tools/standards.test.cjs tools/store-info.test.cjs tools/home-sections.test.cjs tools/delivery-notes.test.cjs tools/apply-oms-export.test.cjs tools/home-message.test.cjs tools/css-bundle.test.cjs
